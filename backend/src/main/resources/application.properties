spring.application.name=support-ticket-rag-poc
server.port=8080
server.servlet.context-path=/api

# ============================================================
# PostgreSQL - relational data + PGVector
# ============================================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:55432/support_ticket_poc}
spring.datasource.username=${DATABASE_USERNAME:pgvector}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ============================================================
# Ollama
# ============================================================

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2:1b}

# ============================================================
# PGVector
# ============================================================

spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# ============================================================
# RAG retrieval
# ============================================================

poc.rag.top-k=${RAG_TOP_K:5}
poc.rag.similarity-threshold=${RAG_SIMILARITY_THRESHOLD:0.50}
